name: tablebook

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_TZ: ${APP_TZ:-Asia/Manila}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:?Copy .env.example to .env first}
      DB_USERNAME: ${DB_USERNAME:?Copy .env.example to .env first}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Copy .env.example to .env first}
      MYSQL_DATABASE: ${DB_DATABASE:?Copy .env.example to .env first}
      MYSQL_USER: ${DB_USERNAME:?Copy .env.example to .env first}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-33061}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  adminer:
    image: adminer:5-standalone
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  uploads:
