name: tablebookp3check

services:
  app:
    build: .
    image: tablebook-test:local
    ports:
      - "127.0.0.1:18080:80"
    environment:
      APP_ENV: test
      APP_TZ: Asia/Manila
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: tablebook_p3_test
      DB_USERNAME: ${DB_USERNAME:?Keep your existing .env}
      DB_PASSWORD: ${DB_PASSWORD:?Keep your existing .env}
      BOOKING_TEST_MODE: isolated
    volumes:
      - .:/var/www/html:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Keep your existing .env}
      MYSQL_DATABASE: tablebook_p3_test
      MYSQL_USER: ${DB_USERNAME:?Keep your existing .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Keep your existing .env}
    volumes:
      - p3_test_dbdata:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  p3_test_dbdata:
